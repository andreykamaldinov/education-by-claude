name: Deploy to gh-pages

# Builds the app from main and publishes the static build to the gh-pages branch.
# GitHub Pages serves that branch: Settings → Pages → Deploy from a branch → gh-pages / (root).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check content and run unit tests
        run: |
          npm run verify:content
          npx ng test --watch=false

      - name: Build with the repository sub-path as base href
        run: |
          REPO="${{ github.event.repository.name }}"
          # user.github.io repositories are served from the domain root, all others from /<repo>/
          if [[ "$REPO" == *.github.io ]]; then BASE_HREF="/"; else BASE_HREF="/$REPO/"; fi
          npx ng build --base-href "$BASE_HREF"

      - name: Add SPA fallback and disable Jekyll
        run: |
          # GitHub Pages has no rewrites: unknown paths serve 404.html, so it must boot the app too.
          cp dist/education/browser/index.html dist/education/browser/404.html
          # Without .nojekyll Pages runs Jekyll, which chokes on Angular {{ }} in the lessons.
          touch dist/education/browser/.nojekyll

      - name: Publish to gh-pages branch
        run: |
          cd dist/education/browser
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
